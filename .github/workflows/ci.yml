name: IT Toolkit CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

  push:
    branches:
      - main
      - dev

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})

    runs-on: ${{ matrix.os }}

    timeout-minutes: 15

    strategy:
      fail-fast: false

      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

        python-version:
          - "3.10"
          - "3.12"
          - "3.14"

    steps:

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile source and tests
        run: python -m compileall -q src tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  ci-status:
    name: CI status

    runs-on: ubuntu-latest

    needs:
      - tests

    if: always()

    steps:

      - name: Verify test matrix
        if: needs.tests.result != 'success'
        run: |
          echo "One or more test matrix jobs failed."
          exit 1

      - name: Confirm successful validation
        if: needs.tests.result == 'success'
        run: echo "All test matrix jobs passed."
